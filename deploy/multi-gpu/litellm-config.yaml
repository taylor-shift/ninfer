# LiteLLM Router config for the qwen3.8-27b worker pool.
#
# Balances OpenAI-compatible traffic across the whole pool with least-busy
# routing (in-flight per deployment), per-deployment API keys, and automatic
# cooldown of failing deployments. Each deployment here is a fleet's front
# balancer (balancer.pl), which itself least-connections across that fleet's
# engines — two-level least-connections, same philosophy as the in-fleet
# balancer.
#
# Keys never live in this file (the repo is public): they come from the
# process environment. `fleet.sh pool start` loads ~/.dsh/.credentials.yaml
# into the environment:
#   NINFER_VAST_API_KEY      Vast 8x5090 fleet key
#   NINFER_RUNPOD_API_KEY    RunPod 7x5090 fleet key
#   VLLM_API_KEY             local winbox 5090 key
#   NINFER_POOL_API_KEY      master key for THIS proxy (clients must send it)
#   NINFER_POOL_VAST_BASE    Vast text base, e.g. http://1.2.3.4:40461/v1
#                            (rotates when the Vast instance is recreated;
#                            fleet.sh injects the current value from vastai)
#   NINFER_POOL_VAST_VISION_BASE  (same, for :8001; enables the Vast vision
#                            deployment when set)
#
# Run: litellm --config litellm-config.yaml --port 8800 --host 0.0.0.0
#
# Clients:
#   text:   model "qwen3.8-27b"       (262144 ctx per stream)
#   vision: model "qwen3.8-27b-vision" (196608 ctx; each fleet's last 2 cards)

model_list:
  # ---- text pool ------------------------------------------------------
  # Per-deployment max_parallel_requests caps the proxy's own view at engine
  # capacity (engines x C=2) so a saturated deployment stops attracting
  # traffic — least-busy cannot see INSIDE an engine's admission queue
  # (requests waiting for a C=2 slot 503 after --pending-timeout-ms, default
  # 30s), so the cap is the only proxy-side guard against queue pile-up.
  - model_name: qwen3.8-27b
    max_parallel_requests: 12    # vast: 6 text engines x C=2
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: ${NINFER_POOL_VAST_BASE}
      api_key: os.environ/NINFER_VAST_API_KEY
    litellm_model_name: vast-8x5090

  - model_name: qwen3.8-27b
    max_parallel_requests: 10    # runpod: 5 text engines x C=2
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: https://ee29h260cf8cwh-8000.proxy.runpod.net/v1
      api_key: os.environ/NINFER_RUNPOD_API_KEY
    litellm_model_name: runpod-7x5090

  - model_name: qwen3.8-27b
    max_parallel_requests: 2     # local: 1 engine x C=2 (shares the card with
                                 # interactive local work — keep the cap tight)
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://192.168.8.15:8000/v1
      api_key: os.environ/VLLM_API_KEY
    litellm_model_name: local-5090

  # ---- vision pool ----------------------------------------------------
  - model_name: qwen3.8-27b-vision
    max_parallel_requests: 4     # runpod: 2 vision engines x C=2
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: https://ee29h260cf8cwh-8001.proxy.runpod.net/v1
      api_key: os.environ/NINFER_RUNPOD_API_KEY
    litellm_model_name: runpod-7x5090-vision

  # Vast vision: the canonical template (584160) publishes :8001. fleet.sh
  # injects the base from the live mapping (persisting the last-known value in
  # vast-vision-base) so an empty var can never hard-fail pool startup; a dead
  # (recreated) base is dropped by the router after one failure.
  - model_name: qwen3.8-27b-vision
    max_parallel_requests: 4     # vast: 2 vision engines x C=2
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: ${NINFER_POOL_VAST_VISION_BASE}
      api_key: os.environ/NINFER_VAST_API_KEY
    litellm_model_name: vast-8x5090-vision

router_settings:
  routing_strategy: least-busy     # in-flight per deployment, like balancer.pl
  num_retries: 2                   # retries go through the router (fresh pick)
  allowed_fails: 1                 # a dead fleet is excluded after ONE failure —
  cooldown_time: 30                # critical: a stopped RunPod pod 404s via its
                                   # proxy and litellm classifies 404 as
                                   # non-retryable client error, so the ONLY
                                   # failover path is fast exclusion here.
                                   # 30s cooldown = back in rotation fast on recovery.
  # NOTE: uvicorn runs a single worker process (launch: no `--workers`).
  # Do NOT add num_workers: >1: workers are separate processes with separate
  # in-memory router state, which fragments least-busy and multiplies the
  # fails needed for cooldown by the worker count. The server is async — one
  # process handles all concurrent streams. (The proxy logs cosmetic
  # "not a valid argument for Router.__init__" warnings for proxy-level keys
  # like num_workers/max_parallel_requests — harmless, the proxy reads them.)
  max_parallel_requests: 64        # global concurrency cap at the proxy

# NOTE on request_timeout: do NOT set it. The global default is 6000 s
# (litellm.request_timeout); a smaller explicit value (e.g. 900 s) risks
# cutting a 262k-context generation mid-stream, and it is silently ignored
# under router_settings (valid only as a litellm global / REQUEST_TIMEOUT env).

# NOTE on thinking controls: ninfer accepts per-request `reasoning_effort`
# (none|minimal|low|medium|high|xhigh|max) and `preserve_thinking` (bool).
# LiteLLM rejects unknown OpenAI params, so clients that use them must send
# allowed_openai_params in the SAME request body:
#   {"reasoning_effort": "none", "allowed_openai_params": ["reasoning_effort"], ...}
# Verified end-to-end through this proxy: 468 ms wall, 0 thinking tokens
# (vs seconds+ with default max effort). drop_params must stay OFF — it would
# silently drop the param instead of passing it through.

general_settings:
  master_key: os.environ/NINFER_POOL_API_KEY   # clients must send this key